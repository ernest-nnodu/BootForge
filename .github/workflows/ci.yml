# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: BootForge Build and Test CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and test with maven
      run: mvn clean verify

    - name: Build docker image
      run: docker build -t bootforge-api .

    - name: Run docker image
      run: docker run --detach --publish 8000:8000 --env SERVER_PORT=8000 --name bootforge-api bootforge-api

    - name: Check BootForge API readiness
      run: |
        for i in {1..5}; do
        if curl --fail --silent http://localhost:8000/actuator/health/readiness; then
        echo "BootForge API is ready"
        exit 0
        fi
        
        echo "BootForge API is not ready yet. Waiting 10 seconds..."
        sleep 10
        done
        
        echo "BootForge API failed to start"
        docker logs bootforge-api
        exit 1

    - name: Stop docker image
      if: always()
      run: docker rm -f bootforge-api || true


