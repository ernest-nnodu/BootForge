
services:
  api:
    build: .
    container_name: bootforge-api
    ports:
      - "8000:8000"

    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8000

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s